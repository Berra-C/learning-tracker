<!doctype html><html lang="tr" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#159e89"><title>Learning Tracker — Öğrenme çalışma alanı</title><link rel="stylesheet" href="assets/css/app.css"><link rel="stylesheet" href="assets/css/enhancements.css"><script>try{document.documentElement.dataset.theme=localStorage.getItem('lt_theme_v1')||'light'}catch(e){}</script></head><body>
<div id="authGate" class="auth-overlay"><div class="auth-panel"><div class="brand-mark" style="margin-bottom:14px">L</div><h1>Learning Tracker</h1><p class="muted-text">Derslerini, öğrenme kaynaklarını ve haftalık planlarını düzenle.</p><div class="auth-tabs"><button class="subtab active" type="button" data-auth-tab="login">Giriş yap</button><button class="subtab" type="button" data-auth-tab="signup">Hesap oluştur</button></div>
<form id="loginForm" class="auth-form"><label>Kullanıcı adı<input name="username" required autocomplete="username"></label><label>İki kelimelik sihirli ifade<input name="magicPhrase" required autocomplete="off"></label><label>6 haneli erişim kodu<input name="accessCode" type="password" pattern="[0-9]{6}" inputmode="numeric" maxlength="6" required></label><label class="check-row"><input name="remember" type="checkbox" checked> Bu cihazda oturumu hatırla</label><button class="primary-btn" type="submit">Giriş yap</button></form>
<form id="signupForm" class="auth-form hidden"><label>6 haneli erişim kodu<input name="accessCode" type="password" pattern="[0-9]{6}" inputmode="numeric" maxlength="6" required></label><label>Erişim kodunu tekrar gir<input name="confirmCode" type="password" pattern="[0-9]{6}" inputmode="numeric" maxlength="6" required></label><button class="primary-btn" type="submit">Hesap oluştur</button></form>
<div id="signupCredentials" class="hidden"></div><p id="authStatus" class="muted-text"></p><button id="demoBtn" class="ghost-btn" type="button">Yerel çalışma alanını aç (deneme)</button><p class="tiny-note">Deneme verileri yalnızca bu tarayıcıda saklanır; Productivity App hesabı oluşturmaz.</p></div></div>
<div class="app" id="appShell"><aside class="sidebar" id="sidebar"><div class="brand"><div class="brand-mark">L</div><div><div class="brand-name">Learning Tracker</div><div class="brand-sub">Personal workspace</div></div></div>
<div><div class="side-label">Workspace</div><nav class="nav" id="mainNav"><button data-page="home"><span class="nav-icon">⌂</span>Genel Bakış</button><button data-page="weekly"><span class="nav-icon">▤</span>Haftalık Plan</button><button data-page="resources"><span class="nav-icon">▣</span>Kaynaklar</button><button data-page="analytics"><span class="nav-icon">▥</span>İstatistikler</button></nav></div>
<div><button class="side-courses-toggle" type="button" data-action="toggle-course-nav"><span class="side-label">Derslerim</span><span class="side-chevron">⌄</span></button><nav class="course-nav" id="sideCourses"></nav><button class="ghost-btn" data-action="add-course" style="width:100%;margin-top:9px">＋ Ders ekle</button></div>
<div><div class="side-label">Preferences</div><nav class="nav"><button data-page="settings"><span class="nav-icon">⚙</span>Ayarlar & bağlantılar</button></nav></div>
<div class="sidebar-bottom"><strong>Bu haftaki ilerleme</strong><p id="sideWeekText"></p><div class="mini-progress"><span id="sideWeekBar"></span></div></div></aside>
<main class="main"><header class="topbar"><div class="crumb"><button class="icon-btn mobile-menu" data-action="mobile-menu" aria-label="Menüyü aç">☰</button>Workspace / <b id="breadcrumb">Genel Bakış</b></div><div class="top-actions"><span id="syncStatus" class="tag">Yerel mod</span><button class="ghost-btn theme-toggle" data-action="theme">☾ Koyu tema</button><button class="icon-btn" data-action="sync" title="Senkronize et" aria-label="Senkronize et">↻</button><button class="icon-btn" data-action="reviews" title="Hafta değerlendirmeleri" aria-label="Hafta değerlendirmeleri">♧</button><button class="brand-mark" data-page="settings" style="width:31px;height:31px;border:0;border-radius:50%;font-size:12px" title="Hesap ayarları">L</button></div></header>
<div class="content" id="mainContent" aria-live="polite"></div></main></div>
